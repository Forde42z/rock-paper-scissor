<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="Rock-Paper-Scissors2.css">
  </head>
  <body>
    <div class="shell">
      <p class="Title">Rock Paper Scissors</p>
      <p class="subtitle">Choose your move — first to dominate</p>

      <div class="moves-row">
        <button class="move-btn js-rock-btn" aria-label="Rock">
          <img class="move-icon" src="images/rock-emoji.png" alt="Rock">
        </button>
        <button class="move-btn js-paper-btn" aria-label="Paper">
          <img class="move-icon" src="images/paper-emoji.png" alt="Paper">
        </button>
        <button class="move-btn js-scissors-btn" aria-label="Scissors">
          <img class="move-icon" src="images/scissors-emoji.png" alt="Scissors">
        </button>
      </div>

      <p class="js-result result"></p>
      
      <p class="js-moves moves-display"></p>

      <p class="js-score score"></p>

      <div class="actions">
        <button class="reset-btn js-reset-btn">Reset score</button>
        <button class="auto-play-btn js-auto-play-btn">Auto Play</button>
      </div>

      <p class="js-reset-confirmation"></p>

      <div class="kbd-hint">
        <span><kbd>R</kbd> rock</span>
        <span class="dot">•</span>
        <span><kbd>P</kbd> paper</span>
        <span class="dot">•</span>
        <span><kbd>S</kbd> scissors</span>
        <span class="dot">•</span>
        <span><kbd>A</kbd> auto</span>
        <span class="dot">•</span>
        <span><kbd>⌫</kbd> reset</span>
      </div>
    </div>

    <!-- YOUR JS - UNTOUCHED, STILL CONNECTED -->
    <script src="rock-paper-scissors2.js"></script>
  </body>
</html>
